name: update-offsets
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch latest offsets
        run: python fetch_offsets.py
      - name: Commit if changed
        run: |
          git config user.name "robloxdumper-bot"
          git config user.email "bot@robloxdumper"
          git add offsets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: update offsets $(date -u +%Y-%m-%d)"
          git push
